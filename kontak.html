 <h2>Kontak</h2>
 <!-- Informasi kontak pustakawan dan layanan bantuan -->
  <section class="form-kontak">
            <h2>Layanan Bantuan & Kontak Pustakawan</h2>
            <p>Punya pertanyaan seputar peminjaman buku digital atau keanggotaan? Hubungi kami melalui formulir di bawah ini.</p>
            <br />
            <form id="form-pesan">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" />

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@domain.com" />

                <label for="pesan">Pertanyaan / Pesan</label>
                <textarea id="pesan" rows="4" placeholder="Tuliskan pesan atau kendala Anda..."></textarea>

                <button type="button" id="tombol-kirim">Kirim Pesan</button>
                <p id="status-form"></p>
            </form>
        </section>
